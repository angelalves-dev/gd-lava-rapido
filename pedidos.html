<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel Administrativo | GD Lava Rápido
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }


        /* =========================================
           CABEÇALHO
        ========================================= */

        header {
            background: #171717;
            border-bottom: 1px solid #333;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo h1 {
            color: #c9a227;
            font-size: 24px;
        }

        .logo p {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        .voltar-btn {
            text-decoration: none;
            color: #111;
            background: #c9a227;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .voltar-btn:hover {
            background: #e0b82f;
            transform: translateY(-2px);
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        .titulo-pagina {
            margin-bottom: 25px;
        }

        .titulo-pagina h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .titulo-pagina p {
            color: #999;
        }


        /* =========================================
           CONTADORES
        ========================================= */

        .contador-pedidos {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .contador-box {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            min-height: 105px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contador-box span {
            color: #999;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .contador-box strong {
            color: #c9a227;
            font-size: 24px;
        }


        /* =========================================
           FILTROS
        ========================================= */

        .filtros {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filtro-btn {
            border: 1px solid #444;
            background: #242424;
            color: #ddd;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .filtro-btn:hover {
            border-color: #c9a227;
            color: #c9a227;
        }

        .filtro-btn.ativo {
            background: #c9a227;
            color: #111;
            border-color: #c9a227;
        }


        /* =========================================
           PEDIDOS
        ========================================= */

        #pedido-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .pedido-card {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 22px;
            transition: 0.3s;
        }

        .pedido-card:hover {
            border-color: #c9a227;
            transform: translateY(-2px);
        }

        .pedido-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .pedido-numero {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .pedido-nome {
            font-size: 21px;
        }

        .status-pedido {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-agendado {
            background: #5a4500;
            color: #ffd84d;
            border: 1px solid #c9a227;
        }

        .status-andamento {
            background: #173b5c;
            color: #66bfff;
            border: 1px solid #2980b9;
        }

        .status-concluido {
            background: #164d2a;
            color: #5cff91;
            border: 1px solid #2ecc71;
        }


        /* =========================================
           INFORMAÇÕES
        ========================================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #242424;
            border-radius: 8px;
            padding: 12px;
        }

        .info-box span {
            display: block;
            color: #888;
            font-size: 11px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-box strong {
            color: #eee;
            font-size: 14px;
        }


        /* =========================================
           SERVIÇOS EXTRAS
        ========================================= */

        .extras-box {
            background: #242424;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .extras-box h4 {
            color: #c9a227;
            margin-bottom: 10px;
        }

        .extra-linha {
            color: #ccc;
            font-size: 13px;
            padding: 4px 0;
        }


        /* =========================================
           TOTAL
        ========================================= */

        .pedido-total {
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-bottom: 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pedido-total span {
            color: #aaa;
        }

        .pedido-total strong {
            color: #c9a227;
            font-size: 24px;
        }


        /* =========================================
           BOTÕES
        ========================================= */

        .acoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .acao-btn {
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .os-btn {
            background: #c9a227;
            color: #111;
        }

        .status-btn {
            background: #292929;
            color: #fff;
            border: 1px solid #444;
        }

        .acao-btn:hover {
            transform: translateY(-2px);
        }


        /* =========================================
           SEM PEDIDOS
        ========================================= */

        .sem-pedidos {
            grid-column: 1 / -1;
            text-align: center;
            background: #1b1b1b;
            border: 1px dashed #444;
            border-radius: 14px;
            padding: 60px 20px;
        }

        .sem-pedidos h3 {
            margin-bottom: 10px;
            color: #c9a227;
        }

        .sem-pedidos p {
            color: #888;
        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            z-index: 1000;
        }

        .modal-conteudo {
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 14px;

            width: 100%;
            max-width: 650px;
            max-height: 90vh;

            overflow-y: auto;
            padding: 25px;
        }

        .modal-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .modal-topo h2 {
            color: #c9a227;
        }

        .fechar-modal {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }


        /* =========================================
           CHECKLIST
        ========================================= */

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;

            background: #242424;
            padding: 13px;
            border-radius: 8px;

            cursor: pointer;
        }

        .checklist-item input {
            width: 18px;
            height: 18px;
            accent-color: #c9a227;
        }

        .checklist-item span {
            color: #ddd;
            font-size: 14px;
        }

        .finalizar-os {
            width: 100%;
            background: #2ecc71;
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }


        /* =========================================
           RESPONSIVO
        ========================================= */

        @media (max-width: 1000px) {

            .contador-pedidos {
                grid-template-columns: repeat(3, 1fr);
            }

            #pedido-container {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 650px) {

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .contador-pedidos {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .pedido-topo {
                flex-direction: column;
            }

            .acoes {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 450px) {

            .container {
                padding: 20px 12px 40px;
            }

            .contador-pedidos {
                grid-template-columns: 1fr;
            }

            .titulo-pagina h2 {
                font-size: 24px;
            }

            .pedido-card {
                padding: 16px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header>

        <div class="header-content">

            <div class="logo">

                <h1>
                    GD Lava Rápido
                </h1>

                <p>
                    Painel Administrativo
                </p>

            </div>


            <a
                href="index.html"
                class="voltar-btn"
            >
                ← Voltar para o site
            </a>

        </div>

    </header>


    <!-- =========================================
         CONTEÚDO
    ========================================== -->

    <main class="container">


        <div class="titulo-pagina">

            <h2>
                Central de Pedidos
            </h2>

            <p>
                Gerencie os agendamentos e ordens de serviço.
            </p>

        </div>


        <!-- =========================================
             CONTADORES
        ========================================== -->

        <section class="contador-pedidos">


            <div class="contador-box">

                <span>
                    Todos os pedidos
                </span>

                <strong id="contador-todos">
                    0
                </strong>

            </div>


            <div class="contador-box">

                <span>
                    Agendados
                </span>

                <strong id="contador-agendados">
                    0
                </strong>

            </div>


            <div class="contador-box">

                <span>
                    Em andamento
                </span>

                <strong id="contador-andamento">
                    0
                </strong>

            </div>


            <div class="contador-box">

                <span>
                    Concluídos
                </span>

                <strong id="contador-concluidos">
                    0
                </strong>

            </div>


            <div class="contador-box">

                <span>
                    Faturamento total
                </span>

                <strong id="faturamento-total">
                    R$ 0,00
                </strong>

            </div>


            <div class="contador-box">

                <span>
                    Faturamento concluído
                </span>

                <strong id="faturamento-concluido">
                    R$ 0,00
                </strong>

            </div>

        </section>


        <!-- =========================================
             FILTROS
        ========================================== -->

        <section class="filtros">

            <button
                class="filtro-btn ativo"
                data-filtro="Todos"
            >
                Todos
            </button>


            <button
                class="filtro-btn"
                data-filtro="Agendado"
            >
                Agendados
            </button>


            <button
                class="filtro-btn"
                data-filtro="Em andamento"
            >
                Em andamento
            </button>


            <button
                class="filtro-btn"
                data-filtro="Concluído"
            >
                Concluídos
            </button>

        </section>


        <!-- =========================================
             PEDIDOS
        ========================================== -->

        <section id="pedido-container">

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const pedidoContainer =
            document.querySelector(
                "#pedido-container"
            );


        let pedidosNovos =
            JSON.parse(
                localStorage.getItem(
                    "pedidosGD"
                )
            ) || [];


        /* =========================================
           COMPATIBILIDADE COM PEDIDO ANTIGO
        ========================================== */

        const pedidoAntigo =
            localStorage.getItem(
                "pedidoGD"
            );


        if (
            pedidoAntigo &&
            pedidosNovos.length === 0
        ) {

            pedidosNovos.push(
                JSON.parse(
                    pedidoAntigo
                )
            );

            localStorage.setItem(
                "pedidosGD",
                JSON.stringify(
                    pedidosNovos
                )
            );
        }


        /* =========================================
           FORMATAR MOEDA
        ========================================== */

        function formatarMoeda(valor) {

            return Number(valor).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );
        }


        /* =========================================
           FORMATAR DATA
        ========================================== */

        function formatarData(data) {

            if (!data) {
                return "-";
            }

            const partes =
                data.split("-");

            if (
                partes.length !== 3
            ) {
                return data;
            }

            return `
                ${partes[2]}/${partes[1]}/${partes[0]}
            `;
        }


        /* =========================================
           STATUS
        ========================================== */

        function obterClasseStatus(status) {

            if (
                status === "Concluído"
            ) {

                return "status-concluido";
            }


            if (
                status === "Em andamento"
            ) {

                return "status-andamento";
            }


            return "status-agendado";
        }


        /* =========================================
           RENDERIZAR PEDIDOS
        ========================================== */

        function renderizarPedidos() {

            pedidoContainer.innerHTML = "";


            if (
                pedidosNovos.length === 0
            ) {

                pedidoContainer.innerHTML = `

                    <div class="sem-pedidos">

                        <h3>
                            Nenhum pedido encontrado
                        </h3>

                        <p>
                            Os novos agendamentos aparecerão aqui.
                        </p>

                    </div>

                `;

                atualizarContadores();

                return;
            }


            pedidosNovos.forEach(
                function (pedido, index) {

                    const status =
                        pedido.status ||
                        "Agendado";


                    let extrasHTML =
                        "";


                    if (
                        pedido.extras &&
                        pedido.extras.length > 0
                    ) {

                        pedido.extras.forEach(
                            function (extra) {

                                extrasHTML += `

                                    <div class="extra-linha">

                                        • ${extra.nome}
                                        -
                                        ${formatarMoeda(
                                            extra.preco
                                        )}

                                    </div>

                                `;
                            }
                        );

                    } else {

                        extrasHTML = `

                            <div class="extra-linha">

                                Nenhum serviço extra.

                            </div>

                        `;
                    }


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.classList.add(
                        "pedido-card"
                    );


                    card.dataset.status =
                        status;


                    card.innerHTML = `

                        <div class="pedido-topo">

                            <div>

                                <div class="pedido-numero">

                                    PEDIDO #${index + 1}

                                </div>

                                <div class="pedido-nome">

                                    ${pedido.nome}

                                </div>

                            </div>


                            <span
                                class="status-pedido ${obterClasseStatus(status)}"
                            >
                                ${status}
                            </span>

                        </div>


                        <div class="info-grid">


                            <div class="info-box">

                                <span>
                                    Veículo
                                </span>

                                <strong>
                                    ${pedido.veiculo || "-"}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Modelo
                                </span>

                                <strong>
                                    ${pedido.modelo || "-"}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Placa
                                </span>

                                <strong>
                                    ${pedido.placa || "-"}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    WhatsApp
                                </span>

                                <strong>
                                    ${pedido.whatsapp || "-"}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Data
                                </span>

                                <strong>
                                    ${formatarData(
                                        pedido.data
                                    )}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Horário
                                </span>

                                <strong>
                                    ${pedido.horario || "-"}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Pacote
                                </span>

                                <strong>
                                    ${pedido.pacote || "-"}
                                </strong>

                            </div>


                        </div>


                        <div class="extras-box">

                            <h4>
                                Serviços extras
                            </h4>

                            ${extrasHTML}

                        </div>


                        <div class="pedido-total">

                            <span>
                                Valor do pedido
                            </span>

                            <strong>
                                ${formatarMoeda(
                                    pedido.total || 0
                                )}
                            </strong>

                        </div>


                        <div class="acoes">

                            <button
                                class="acao-btn os-btn"
                                onclick="abrirOrdemServico(${pedido.id})"
                            >
                                📋 ORDEM DE SERVIÇO
                            </button>


                            <button
                                class="acao-btn status-btn"
                                onclick="alterarStatus(${pedido.id})"
                            >
                                🔄 ALTERAR STATUS
                            </button>

                        </div>

                    `;


                    pedidoContainer.appendChild(
                        card
                    );

                }
            );


            atualizarContadores();
        }


        /* =========================================
           CONTADORES
        ========================================== */

        function atualizarContadores() {

            let totalAgendados = 0;

            let totalAndamento = 0;

            let totalConcluidos = 0;

            let faturamentoTotal = 0;

            let faturamentoConcluido = 0;


            pedidosNovos.forEach(
                function (pedido) {

                    const valorPedido =
                        Number(
                            pedido.total
                        ) || 0;


                    const status =
                        pedido.status ||
                        "Agendado";


                    faturamentoTotal +=
                        valorPedido;


                    if (
                        status ===
                        "Agendado"
                    ) {

                        totalAgendados++;

                    } else if (
                        status ===
                        "Em andamento"
                    ) {

                        totalAndamento++;

                    } else if (
                        status ===
                        "Concluído"
                    ) {

                        totalConcluidos++;

                        faturamentoConcluido +=
                            valorPedido;
                    }

                }
            );


            document.querySelector(
                "#contador-todos"
            ).textContent =
                pedidosNovos.length;


            document.querySelector(
                "#contador-agendados"
            ).textContent =
                totalAgendados;


            document.querySelector(
                "#contador-andamento"
            ).textContent =
                totalAndamento;


            document.querySelector(
                "#contador-concluidos"
            ).textContent =
                totalConcluidos;


            document.querySelector(
                "#faturamento-total"
            ).textContent =
                formatarMoeda(
                    faturamentoTotal
                );


            document.querySelector(
                "#faturamento-concluido"
            ).textContent =
                formatarMoeda(
                    faturamentoConcluido
                );
        }


        /* =========================================
           ALTERAR STATUS
        ========================================== */

        function alterarStatus(
            pedidoId
        ) {

            const pedido =
                pedidosNovos.find(
                    function (item) {

                        return (
                            item.id ===
                            pedidoId
                        );
                    }
                );


            if (!pedido) {
                return;
            }


            const statusAtual =
                pedido.status ||
                "Agendado";


            if (
                statusAtual ===
                "Agendado"
            ) {

                pedido.status =
                    "Em andamento";

            } else if (
                statusAtual ===
                "Em andamento"
            ) {

                pedido.status =
                    "Concluído";

            } else {

                pedido.status =
                    "Agendado";
            }


            localStorage.setItem(
                "pedidosGD",
                JSON.stringify(
                    pedidosNovos
                )
            );


            renderizarPedidos();
        }


        /* =========================================
           ABRIR ORDEM DE SERVIÇO
        ========================================== */

        function abrirOrdemServico(
            pedidoId
        ) {

            const pedido =
                pedidosNovos.find(
                    function (item) {

                        return (
                            item.id ===
                            pedidoId
                        );
                    }
                );


            if (!pedido) {
                return;
            }


            let checklistExtras =
                "";


            if (
                pedido.extras &&
                pedido.extras.length > 0
            ) {

                pedido.extras.forEach(
                    function (extra) {

                        checklistExtras += `

                            <label class="checklist-item">

                                <input
                                    type="checkbox"
                                    class="check-os"
                                >

                                <span>
                                    Realizar:
                                    ${extra.nome}
                                </span>

                            </label>

                        `;
                    }
                );
            }


            const modal =
                document.createElement(
                    "div"
                );


            modal.classList.add(
                "modal"
            );


            modal.innerHTML = `

                <div class="modal-conteudo">


                    <div class="modal-topo">

                        <h2>
                            Ordem de Serviço
                        </h2>


                        <button
                            class="fechar-modal"
                            onclick="this.closest('.modal').remove()"
                        >
                            ×
                        </button>

                    </div>


                    <div class="info-grid">


                        <div class="info-box">

                            <span>
                                Cliente
                            </span>

                            <strong>
                                ${pedido.nome}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                WhatsApp
                            </span>

                            <strong>
                                ${pedido.whatsapp || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Veículo
                            </span>

                            <strong>
                                ${pedido.veiculo || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Modelo
                            </span>

                            <strong>
                                ${pedido.modelo || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Placa
                            </span>

                            <strong>
                                ${pedido.placa || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Pacote
                            </span>

                            <strong>
                                ${pedido.pacote || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Data
                            </span>

                            <strong>
                                ${formatarData(
                                    pedido.data
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Horário
                            </span>

                            <strong>
                                ${pedido.horario || "-"}
                            </strong>

                        </div>

                    </div>


                    <h3>
                        Checklist
                    </h3>


                    <div class="checklist">


                        <label class="checklist-item">

                            <input
                                type="checkbox"
                                class="check-os"
                            >

                            <span>
                                Conferir estado geral do veículo
                            </span>

                        </label>


                        <label class="checklist-item">

                            <input
                                type="checkbox"
                                class="check-os"
                            >

                            <span>
                                Conferir rodas e pneus
                            </span>

                        </label>


                        <label class="checklist-item">

                            <input
                                type="checkbox"
                                class="check-os"
                            >

                            <span>
                                Realizar serviços do pacote
                            </span>

                        </label>


                        ${checklistExtras}


                        <label class="checklist-item">

                            <input
                                type="checkbox"
                                class="check-os"
                            >

                            <span>
                                Secagem e acabamento
                            </span>

                        </label>


                        <label class="checklist-item">

                            <input
                                type="checkbox"
                                class="check-os"
                            >

                            <span>
                                Conferência final
                            </span>

                        </label>


                    </div>


                    <button
                        class="finalizar-os"
                        id="finalizar-os-btn"
                    >
                        ✓ FINALIZAR ORDEM DE SERVIÇO
                    </button>


                </div>

            `;


            document.body.appendChild(
                modal
            );


            const checkboxes =
                modal.querySelectorAll(
                    ".check-os"
                );


            const finalizarBtn =
                modal.querySelector(
                    "#finalizar-os-btn"
                );


            finalizarBtn.addEventListener(
                "click",
                function () {

                    let todosMarcados =
                        true;


                    checkboxes.forEach(
                        function (checkbox) {

                            if (
                                !checkbox.checked
                            ) {

                                todosMarcados =
                                    false;
                            }

                        }
                    );


                    if (!todosMarcados) {

                        alert(
                            "Marque todos os itens do checklist antes de finalizar."
                        );

                        return;
                    }


                    pedido.status =
                        "Concluído";


                    localStorage.setItem(
                        "pedidosGD",
                        JSON.stringify(
                            pedidosNovos
                        )
                    );


                    modal.remove();


                    renderizarPedidos();


                    alert(
                        "Ordem de serviço finalizada com sucesso!"
                    );
                }
            );
        }


        /* =========================================
           FILTROS
        ========================================== */

        const botoesFiltro =
            document.querySelectorAll(
                ".filtro-btn"
            );


        botoesFiltro.forEach(
            function (botao) {

                botao.addEventListener(
                    "click",
                    function () {

                        const filtro =
                            botao.dataset.filtro;


                        const cards =
                            document.querySelectorAll(
                                ".pedido-card"
                            );


                        cards.forEach(
                            function (card) {

                                if (
                                    filtro ===
                                    "Todos"
                                ) {

                                    card.style.display =
                                        "";

                                } else if (
                                    card.dataset.status ===
                                    filtro
                                ) {

                                    card.style.display =
                                        "";

                                } else {

                                    card.style.display =
                                        "none";
                                }

                            }
                        );


                        botoesFiltro.forEach(
                            function (outroBotao) {

                                outroBotao.classList.remove(
                                    "ativo"
                                );

                            }
                        );


                        botao.classList.add(
                            "ativo"
                        );
                    }
                );
            }
        );


        /* =========================================
           INICIAR
        ========================================== */

        renderizarPedidos();

    </script>

</body>

</html>
