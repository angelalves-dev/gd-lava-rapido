<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - GD Lava Rápido</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <div class="container">

            <h1>GD Lava Rápido</h1>

            <p>Painel de Pedidos</p>

        </div>

    </header>


    <main>

        <section class="container">

            <h2>Pedidos recebidos</h2>

            <div id="pedido-container">

                <!-- Os pedidos aparecerão aqui -->

            </div>

        </section>

    </main>


    <script>

        const pedidoContainer =
            document.querySelector("#pedido-container");


        const pedidosNovos =
            JSON.parse(
                localStorage.getItem("pedidosGD")
            ) || [];


        const pedidoAntigo =
            localStorage.getItem("pedidoGD");


        // Se existir um pedido antigo,
        // adiciona ele à lista.

        if (pedidoAntigo && pedidosNovos.length === 0) {

            pedidosNovos.push(
                JSON.parse(pedidoAntigo)
            );

        }


        if (pedidosNovos.length === 0) {

            pedidoContainer.innerHTML = `

                <div class="vehicle-box">

                    <h3>Nenhum pedido encontrado</h3>

                    <p>
                        Ainda não existem pedidos cadastrados.
                    </p>

                </div>

            `;

        } else {


            pedidosNovos.forEach(
                function (pedido, index) {


                    const card =
                        document.createElement("div");


                    card.classList.add("vehicle-box");


                    card.innerHTML = `

                        <h3>
                            Pedido #${index + 1}
                        </h3>

                        <hr>

                        <p>
                            <strong>Cliente:</strong>
                            ${pedido.nome}
                        </p>

                        <p>
                            <strong>WhatsApp:</strong>
                            ${pedido.whatsapp}
                        </p>

                        <p>
                            <strong>Veículo:</strong>
                            ${pedido.veiculo}
                        </p>

                        <p>
                            <strong>Modelo:</strong>
                            ${pedido.modelo}
                        </p>

                        <p>
                            <strong>Placa:</strong>
                            ${pedido.placa}
                        </p>

                        <p>
                            <strong>Pacote:</strong>
                            ${pedido.pacote}
                        </p>

                        <p>
                            <strong>Extras:</strong>
                            ${
                                pedido.extras &&
                                pedido.extras.length > 0
                                    ? pedido.extras.join(", ")
                                    : "Nenhum"
                            }
                        </p>

                        <p>
                            <strong>Data:</strong>
                            ${pedido.data}
                        </p>

                        <p>
                            <strong>Horário:</strong>
                            ${pedido.horario}
                        </p>

                        <div class="status-pedido ${pedido.status === "Concluído" ? "status-concluido" : "status-agendado"}">
    ${pedido.status || "Agendado"}
</div>

                        <div class="resumo-total">

                            TOTAL: R$ ${pedido.total}

                        </div>
<button
    class="vehicle-btn abrir-os-btn"
    data-id="${pedido.id}"
>
    ABRIR ORDEM DE SERVIÇO
</button>
                    `;


                    pedidoContainer.appendChild(card);
const botaoOS =
    card.querySelector(".abrir-os-btn");

botaoOS.addEventListener("click", function () {

    const pedidoId =
        Number(botaoOS.dataset.id);

    const pedidoSelecionado =
        pedidosNovos.find(function (pedido) {

            return pedido.id === pedidoId;

        });

    if (!pedidoSelecionado) {

        alert("Pedido não encontrado.");

        return;

    }

    const ordemServico =
    document.createElement("div");

ordemServico.classList.add("vehicle-selection");

ordemServico.innerHTML = `

    <div class="vehicle-box checklist-box">

        <h2>Ordem de Serviço</h2>

        <p>
            Pedido #${pedidoId}
        </p>

        <hr>

        <div class="resumo-item">
            <span>Cliente</span>
            <strong>${pedidoSelecionado.nome}</strong>
        </div>

        <div class="resumo-item">
            <span>WhatsApp</span>
            <strong>${pedidoSelecionado.whatsapp}</strong>
        </div>

        <div class="resumo-item">
            <span>Veículo</span>
            <strong>
                ${pedidoSelecionado.veiculo} -
                ${pedidoSelecionado.modelo}
            </strong>
        </div>

        <div class="resumo-item">
            <span>Placa</span>
            <strong>${pedidoSelecionado.placa}</strong>
        </div>

        <div class="resumo-item">
            <span>Pacote</span>
            <strong>${pedidoSelecionado.pacote}</strong>
        </div>

        <div class="resumo-item">
            <span>Extras</span>
            <strong>
                ${
                    pedidoSelecionado.extras &&
                    pedidoSelecionado.extras.length > 0
                        ? pedidoSelecionado.extras.join(", ")
                        : "Nenhum"
                }
            </strong>
        </div>

        <div class="resumo-item">
            <span>Data</span>
            <strong>${pedidoSelecionado.data}</strong>
        </div>

        <div class="resumo-item">
            <span>Horário</span>
            <strong>${pedidoSelecionado.horario}</strong>
        </div>

        <div class="resumo-total">
            TOTAL: R$ ${pedidoSelecionado.total}
        </div>

        <hr>

        <h3>Checklist do funcionário</h3>

        <div class="check-item">
            <label>
                <input type="checkbox">
                Conferir estado geral do veículo
            </label>
        </div>

        <div class="check-item">
            <label>
                <input type="checkbox">
                Conferir rodas e pneus
            </label>
        </div>

        <div class="check-item">
            <label>
                <input type="checkbox">
                Realizar serviços do pacote
                ${pedidoSelecionado.pacote}
            </label>
        </div>

        ${
            pedidoSelecionado.extras &&
            pedidoSelecionado.extras.length > 0
                ? pedidoSelecionado.extras.map(function (extra) {

                    return `
                        <div class="check-item">
                            <label>
                                <input type="checkbox">
                                Realizar: ${extra}
                            </label>
                        </div>
                    `;

                }).join("")
                : ""
        }

        <div class="check-item">
            <label>
                <input type="checkbox">
                Secagem e acabamento do veículo
            </label>
        </div>

        <div class="check-item">
            <label>
                <input type="checkbox">
                Conferência final
            </label>
        </div>

        <button
            id="fechar-os-btn"
            class="vehicle-btn"
        >
            FECHAR ORDEM DE SERVIÇO
        </button>

    </div>

`;

document.body.appendChild(ordemServico);


const fecharOS =
    ordemServico.querySelector("#fechar-os-btn");


fecharOS.addEventListener("click", function () {

    const checkboxes =
        ordemServico.querySelectorAll(
            'input[type="checkbox"]'
        );

    let todosMarcados = true;

    checkboxes.forEach(function (checkbox) {

        if (!checkbox.checked) {
            todosMarcados = false;
        }

    });

    if (!todosMarcados) {

        alert(
            "Antes de finalizar a Ordem de Serviço, marque todos os itens do checklist."
        );

        return;

    }

    const pedidosAtualizados =
        JSON.parse(
            localStorage.getItem("pedidosGD")
        ) || [];

    const pedidoAtualizado =
        pedidosAtualizados.find(function (pedido) {

            return pedido.id === pedidoId;

        });

    if (pedidoAtualizado) {

        pedidoAtualizado.status = "Concluído";

        localStorage.setItem(
            "pedidosGD",
            JSON.stringify(pedidosAtualizados)
        );

    }

    alert(
        "Ordem de Serviço finalizada com sucesso! ✅"
    );

    ordemServico.remove();

    location.reload();

});

});
                }
            );

        }

    </script>

</body>

</html>
