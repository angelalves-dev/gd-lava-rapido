<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - GD Lava Rápido</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <div class="container">

            <h1>GD Lava Rápido</h1>

            <p>Painel de Pedidos</p>

        </div>

    </header>


    <main>

        <section class="container">

            <h2>Pedidos recebidos</h2>
<div class="filtros-pedidos">

    <button class="filtro-btn ativo" data-filtro="Todos">
        TODOS
    </button>

    <button class="filtro-btn" data-filtro="Agendado">
        AGENDADOS
    </button>

    <button class="filtro-btn" data-filtro="Em andamento">
        EM ANDAMENTO
    </button>

    <button class="filtro-btn" data-filtro="Concluído">
        CONCLUÍDOS
    </button>

</div>

            <div class="contador-pedidos">

    <div class="contador-box">
        <span>Todos</span>
        <strong id="contador-todos">0</strong>
    </div>

    <div class="contador-box">
        <span>Agendados</span>
        <strong id="contador-agendados">0</strong>
    </div>

    <div class="contador-box">
        <span>Em andamento</span>
        <strong id="contador-andamento">0</strong>
    </div>

    <div class="contador-box">
        <span>Concluídos</span>
        <strong id="contador-concluidos">0</strong>
    </div>

</div>
            <div id="pedido-container">

                <!-- Os pedidos aparecerão aqui -->

            </div>

        </section>

    </main>


    <script>

        const pedidoContainer =
            document.querySelector("#pedido-container");


        const pedidosNovos =
            JSON.parse(
                localStorage.getItem("pedidosGD")
            ) || [];


        const pedidoAntigo =
            localStorage.getItem("pedidoGD");


        if (pedidoAntigo && pedidosNovos.length === 0) {

            pedidosNovos.push(
                JSON.parse(pedidoAntigo)
            );

        }


        if (pedidosNovos.length === 0) {

            pedidoContainer.innerHTML = `

                <div class="vehicle-box">

                    <h3>Nenhum pedido encontrado</h3>

                    <p>
                        Ainda não existem pedidos cadastrados.
                    </p>

                </div>

            `;

        } else {


            pedidosNovos.forEach(
                function (pedido, index) {


                    const card =
                        document.createElement("div");


                    card.classList.add("vehicle-box");


                    card.innerHTML = `

                        <h3>
                            Pedido #${index + 1}
                        </h3>

                        <hr>

                        <p>
                            <strong>Cliente:</strong>
                            ${pedido.nome}
                        </p>

                        <p>
                            <strong>WhatsApp:</strong>
                            ${pedido.whatsapp}
                        </p>

                        <p>
                            <strong>Veículo:</strong>
                            ${pedido.veiculo}
                        </p>

                        <p>
                            <strong>Modelo:</strong>
                            ${pedido.modelo}
                        </p>

                        <p>
                            <strong>Placa:</strong>
                            ${pedido.placa}
                        </p>

                        <p>
                            <strong>Pacote:</strong>
                            ${pedido.pacote}
                        </p>

                        <p>
                            <strong>Extras:</strong>
                            ${
                                pedido.extras &&
                                pedido.extras.length > 0
                                    ? pedido.extras.join(", ")
                                    : "Nenhum"
                            }
                        </p>

                        <p>
                            <strong>Data:</strong>
                            ${pedido.data}
                        </p>

                        <p>
                            <strong>Horário:</strong>
                            ${pedido.horario}
                        </p>


                        <div class="status-pedido ${
                            pedido.status === "Concluído"
                                ? "status-concluido"
                                : pedido.status === "Em andamento"
                                    ? "status-andamento"
                                    : "status-agendado"
                        }">

                            ${pedido.status || "Agendado"}

                        </div>


                        <div class="resumo-total">

                            TOTAL: R$ ${pedido.total}

                        </div>


                        <button
                            class="vehicle-btn abrir-os-btn"
                        >

                            ABRIR ORDEM DE SERVIÇO

                        </button>


                        <button
                            class="vehicle-btn alterar-status-btn"
                        >

                            ALTERAR STATUS

                        </button>

                    `;


                    pedidoContainer.appendChild(card);


                    /* =====================================
                       BOTÃO ABRIR ORDEM DE SERVIÇO
                    ===================================== */

                    const botaoOS =
                        card.querySelector(".abrir-os-btn");


                    botaoOS.addEventListener(
                        "click",
                        function () {


                            const ordemServico =
                                document.createElement("div");


                            ordemServico.classList.add(
                                "vehicle-selection"
                            );


                            ordemServico.innerHTML = `

                                <div class="vehicle-box checklist-box">

                                    <h2>
                                        Ordem de Serviço
                                    </h2>


                                    <p>
                                        Pedido #${index + 1}
                                    </p>


                                    <hr>


                                    <div class="resumo-item">

                                        <span>Cliente</span>

                                        <strong>
                                            ${pedido.nome}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>WhatsApp</span>

                                        <strong>
                                            ${pedido.whatsapp}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Veículo</span>

                                        <strong>
                                            ${pedido.veiculo} -
                                            ${pedido.modelo}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Placa</span>

                                        <strong>
                                            ${pedido.placa}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Pacote</span>

                                        <strong>
                                            ${pedido.pacote}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Extras</span>

                                        <strong>

                                            ${
                                                pedido.extras &&
                                                pedido.extras.length > 0
                                                    ? pedido.extras.join(", ")
                                                    : "Nenhum"
                                            }

                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Data</span>

                                        <strong>
                                            ${pedido.data}
                                        </strong>

                                    </div>


                                    <div class="resumo-item">

                                        <span>Horário</span>

                                        <strong>
                                            ${pedido.horario}
                                        </strong>

                                    </div>


                                    <div class="resumo-total">

                                        TOTAL:
                                        R$ ${pedido.total}

                                    </div>


                                    <hr>


                                    <h3>
                                        Checklist do funcionário
                                    </h3>


                                    <div class="check-item">

                                        <label>

                                            <input type="checkbox">

                                            Conferir estado geral do veículo

                                        </label>

                                    </div>


                                    <div class="check-item">

                                        <label>

                                            <input type="checkbox">

                                            Conferir rodas e pneus

                                        </label>

                                    </div>


                                    <div class="check-item">

                                        <label>

                                            <input type="checkbox">

                                            Realizar serviços do pacote

                                        </label>

                                    </div>


                                    ${
                                        pedido.extras &&
                                        pedido.extras.length > 0

                                            ? pedido.extras.map(
                                                function (extra) {

                                                    return `

                                                        <div class="check-item">

                                                            <label>

                                                                <input type="checkbox">

                                                                Realizar:
                                                                ${extra}

                                                            </label>

                                                        </div>

                                                    `;

                                                }
                                            ).join("")

                                            : ""
                                    }


                                    <div class="check-item">

                                        <label>

                                            <input type="checkbox">

                                            Secagem e acabamento do veículo

                                        </label>

                                    </div>


                                    <div class="check-item">

                                        <label>

                                            <input type="checkbox">

                                            Conferência final

                                        </label>

                                    </div>


                                    <button
                                        class="vehicle-btn fechar-os-btn"
                                    >

                                        FECHAR ORDEM DE SERVIÇO

                                    </button>

                                </div>

                            `;


                            document.body.appendChild(
                                ordemServico
                            );


                            const fecharOS =
                                ordemServico.querySelector(
                                    ".fechar-os-btn"
                                );


                            fecharOS.addEventListener(
                                "click",
                                function () {


                                    const checkboxes =
                                        ordemServico.querySelectorAll(
                                            'input[type="checkbox"]'
                                        );


                                    let todosMarcados =
                                        true;


                                    checkboxes.forEach(
                                        function (checkbox) {

                                            if (
                                                !checkbox.checked
                                            ) {

                                                todosMarcados =
                                                    false;

                                            }

                                        }
                                    );


                                    if (!todosMarcados) {

                                        alert(
                                            "Antes de finalizar a Ordem de Serviço, marque todos os itens do checklist."
                                        );

                                        return;

                                    }


                                    pedido.status =
                                        "Concluído";


                                    localStorage.setItem(
                                        "pedidosGD",
                                        JSON.stringify(
                                            pedidosNovos
                                        )
                                    );


                                    alert(
                                        "Ordem de Serviço finalizada com sucesso! ✅"
                                    );


                                    ordemServico.remove();


                                    location.reload();

                                }
                            );

                        }
                    );


                    /* =====================================
                       BOTÃO ALTERAR STATUS
                    ===================================== */

                    const botaoStatus =
                        card.querySelector(
                            ".alterar-status-btn"
                        );


                    botaoStatus.addEventListener(
                        "click",
                        function () {


                            if (
                                pedido.status === "Agendado" ||
                                !pedido.status
                            ) {

                                pedido.status =
                                    "Em andamento";

                            }

                            else if (
                                pedido.status === "Em andamento"
                            ) {

                                pedido.status =
                                    "Concluído";

                            }

                            else if (
                                pedido.status === "Concluído"
                            ) {

                                pedido.status =
                                    "Agendado";

                            }


                            localStorage.setItem(
                                "pedidosGD",
                                JSON.stringify(
                                    pedidosNovos
                                )
                            );


                            location.reload();

                        }
                    );


                }
            );

        }
        // =========================================
        // FILTROS DE PEDIDOS
        // =========================================

        const botoesFiltro =
            document.querySelectorAll(".filtro-btn");


        botoesFiltro.forEach(function (botao) {

            botao.addEventListener("click", function () {

                const filtro =
                    botao.dataset.filtro;


                const cards =
                    document.querySelectorAll(
                        "#pedido-container .vehicle-box"
                    );


                cards.forEach(function (card, index) {

                    const pedido =
                        pedidosNovos[index];


                    if (filtro === "Todos") {

                        card.style.display = "";

                    }

                    else if (
                        pedido &&
                        (pedido.status || "Agendado") === filtro
                    ) {

                        card.style.display = "";

                    }

                    else {

                        card.style.display = "none";

                    }

                });


                // Remove o destaque dos outros botões

                botoesFiltro.forEach(function (outroBotao) {

                    outroBotao.classList.remove("ativo");

                });


                // Destaca o botão selecionado

                botao.classList.add("ativo");

            });

        });
    </script>

</body>

</html>
