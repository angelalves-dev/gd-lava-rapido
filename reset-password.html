<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GD Lava Rápido | Nova Senha</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #0b0b0b;

            color: #fff;
        }

        .box {

            width: 100%;

            max-width: 430px;

            padding: 35px;

            background: #151515;

            border: 1px solid #292929;

            border-radius: 16px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.55);
        }

        .logo {

            text-align: center;

            margin-bottom: 28px;
        }

        .logo h1 {

            color: #d4af37;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .logo p {

            color: #888;

            font-size: 14px;
        }

        h2 {

            margin-bottom: 10px;

            font-size: 24px;
        }

        .descricao {

            color: #999;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .campo {

            margin-bottom: 18px;
        }

        .campo label {

            display: block;

            margin-bottom: 7px;

            color: #ccc;

            font-size: 14px;
        }

        .campo input {

            width: 100%;

            padding: 14px;

            border:
                1px solid #333;

            border-radius: 9px;

            background: #0d0d0d;

            color: #fff;

            outline: none;

            font-size: 15px;
        }

        .campo input:focus {

            border-color: #d4af37;
        }

        button {

            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 14px;

            background: #d4af37;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {

            background: #f0d05c;
        }

        button:disabled {

            background: #555;

            color: #999;

            cursor: not-allowed;
        }

        .mensagem {

            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;
        }

        .erro {

            background: #4a1616;

            border:
                1px solid #8e3030;

            color: #ff9c9c;
        }

        .sucesso {

            background: #163b24;

            border:
                1px solid #2e8b57;

            color: #8dffb2;
        }

        .voltar {

            display: none;

            margin-top: 15px;

            text-align: center;

            color: #d4af37;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="box">


        <div class="logo">

            <h1>
                GD Lava Rápido
            </h1>

            <p>
                Acesso administrativo
            </p>

        </div>


        <h2>
            Criar nova senha
        </h2>


        <p class="descricao">
            Digite sua nova senha para
            recuperar o acesso ao painel
            administrativo.
        </p>


        <div
            id="mensagemErro"
            class="mensagem erro">
        </div>


        <div
            id="mensagemSucesso"
            class="mensagem sucesso">
        </div>


        <form id="formNovaSenha">


            <div class="campo">

                <label for="novaSenha">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="novaSenha"
                    placeholder="Digite sua nova senha"
                    minlength="6"
                    required>

            </div>


            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                id="btnSalvar">

                SALVAR NOVA SENHA

            </button>


        </form>


        <a
            href="pedidos.html"
            id="linkVoltar"
            class="voltar">

            Voltar para o painel

        </a>


    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =========================================
           CONFIGURAÇÃO
        ========================================= */

        const SUPABASE_URL =
            "https://ljswwokxcgglqluzwctq.supabase.co";


        /*
           COLE AQUI A MESMA PUBLISHABLE KEY
           QUE VOCÊ JÁ USA NO SEU PROJETO.
        */

        const SUPABASE_KEY =
            "sb_publishable_CS4rdWdRC9iVrHNvXXCzHA_6kH6WRlG";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================
           ELEMENTOS
        ========================================= */

        const form =
            document.getElementById(
                "formNovaSenha"
            );


        const novaSenha =
            document.getElementById(
                "novaSenha"
            );


        const confirmarSenha =
            document.getElementById(
                "confirmarSenha"
            );


        const botao =
            document.getElementById(
                "btnSalvar"
            );


        const mensagemErro =
            document.getElementById(
                "mensagemErro"
            );


        const mensagemSucesso =
            document.getElementById(
                "mensagemSucesso"
            );


        const linkVoltar =
            document.getElementById(
                "linkVoltar"
            );


        /* =========================================
           MENSAGENS
        ========================================= */

        function mostrarErro(texto) {

            mensagemErro.textContent =
                texto;

            mensagemErro.style.display =
                "block";

        }


        function esconderErro() {

            mensagemErro.style.display =
                "none";

        }


        function mostrarSucesso(texto) {

            mensagemSucesso.textContent =
                texto;

            mensagemSucesso.style.display =
                "block";

        }


        /* =========================================
           VERIFICAR RECUPERAÇÃO
        ========================================= */

        supabaseClient.auth.onAuthStateChange(
            function(event, session) {

                console.log(
                    "Evento de autenticação:",
                    event
                );

                if (
                    event ===
                    "PASSWORD_RECOVERY"
                ) {

                    console.log(
                        "Sessão de recuperação detectada."
                    );

                }

            }
        );


        /* =========================================
           TROCAR SENHA
        ========================================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                esconderErro();

                mensagemSucesso.style.display =
                    "none";


                const senha =
                    novaSenha.value;


                const confirmacao =
                    confirmarSenha.value;


                /* -------------------------------
                   VALIDAR SENHAS
                -------------------------------- */

                if (senha.length < 6) {

                    mostrarErro(
                        "A senha deve ter pelo menos 6 caracteres."
                    );

                    return;

                }


                if (
                    senha !==
                    confirmacao
                ) {

                    mostrarErro(
                        "As senhas não são iguais."
                    );

                    return;

                }


                /* -------------------------------
                   DESABILITAR BOTÃO
                -------------------------------- */

                botao.disabled =
                    true;

                botao.textContent =
                    "SALVANDO...";


                try {

                    /* ---------------------------
                       ATUALIZAR SENHA
                    --------------------------- */

                    const resultado =
                        await supabaseClient
                            .auth
                            .updateUser({
                                password:
                                    senha
                            });


                    if (
                        resultado.error
                    ) {

                        console.error(
                            resultado.error
                        );

                        mostrarErro(
                            resultado.error.message
                        );

                        botao.disabled =
                            false;

                        botao.textContent =
                            "SALVAR NOVA SENHA";

                        return;

                    }


                    /* ---------------------------
                       SUCESSO
                    --------------------------- */

                    form.style.display =
                        "none";


                    mostrarSucesso(
                        "Sua senha foi alterada com sucesso. Agora você já pode acessar o painel administrativo."
                    );


                    linkVoltar.style.display =
                        "block";


                }

                catch (erro) {

                    console.error(
                        erro
                    );


                    mostrarErro(
                        "Ocorreu um erro ao alterar a senha."
                    );


                    botao.disabled =
                        false;

                    botao.textContent =
                        "SALVAR NOVA SENHA";

                }

            }
        );


    </script>


</body>

</html>
